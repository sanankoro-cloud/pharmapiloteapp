version: '3.8'

services:
  pharmapilote:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_GENAI_KEY: ${VITE_GOOGLE_GENAI_KEY}
    container_name: pharmapilote-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - pharmapilote-network

networks:
  pharmapilote-network:
    driver: bridge
